name: Build & Push Docker Image

on:
  push:
    branches:
      - unstable
  workflow_dispatch:

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: 🧾 Checkout source
      uses: actions/checkout@v4

    - name: 📦 Get package version
      id: package-version
      run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

    - name: 🐳 Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🐳 Docker Login (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🛠️ Build & Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/c4lyp5o/ezjot:${{ steps.package-version.outputs.version }}
          ghcr.io/c4lyp5o/ezjot:latest

    - name: 🔔 Notify ntfy
      if: always()
      env:
        NTFY_URL: ${{ secrets.NTFY_URL }}
      run: |
        if [ -n "$NTFY_URL" ]; then
          curl \
            -H "Title: Build ${{ job.status }}: ezjot:${{ steps.package-version.outputs.version }}" \
            -H "Priority: ${{ job.status == 'success' && 'default' || 'high' }}" \
            -H "Tags: ${{ job.status == 'success' && 'white_check_mark' || 'x' }},rocket" \
            -d "Branch: ${{ github.ref_name }} | Status: ${{ job.status }}" \
            "$NTFY_URL"
        fi
